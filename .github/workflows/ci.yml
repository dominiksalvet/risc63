name: CI
on: [push, pull_request]

jobs:
  Test:
    runs-on: ubuntu-latest
    container: ghdl/ghdl:ubuntu20-mcode

    steps:
    - name: Checkout commit
      uses: actions/checkout@v4

    - name: Check GHDL
      run: ghdl --version

    - name: Build source files
      run: |
        cd build/
        make

    - name: Run tests
      run: |
        cd build/
        make test
